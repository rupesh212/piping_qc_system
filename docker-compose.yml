version: "3.9"

services:
  db:
    image: postgres:15
    container_name: piping_qc_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-piping_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-piping_pass}
      POSTGRES_DB: ${POSTGRES_DB:-piping_qc}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-piping_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: piping_qc_backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-piping_user}:${POSTGRES_PASSWORD:-piping_pass}@db:5432/${POSTGRES_DB:-piping_qc}
    volumes:
      - ./uploads:/app/uploads
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: piping_qc_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000

volumes:
  postgres_data:
